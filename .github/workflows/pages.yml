name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate Pages artifact
        run: |
          find dist -name .DS_Store -delete
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          if find dist -type l | grep -q .; then
            echo "Pages artifact must not contain symbolic links"
            exit 1
          fi

      - name: Publish gh-pages branch
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/gamedevland-pages
          cd /tmp/gamedevland-pages
          git switch --orphan gh-pages
          cp -R "$GITHUB_WORKSPACE/dist/." .
          git add --all
          git commit -m "Deploy ${DEPLOY_SHA}"
          git push --force origin gh-pages
